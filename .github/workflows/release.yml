# Deliberately manual: the first Marketplace upload must be performed
# by the owner following JetBrains' publication and signing requirements.
name: Package Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build plugin archive
        run: bash ./gradlew check buildPlugin --stacktrace
      - name: Upload ZIP for manual review
        uses: actions/upload-artifact@v7
        with:
          name: ARGBColorLens-release-candidate
          path: build/distributions/*.zip
          if-no-files-found: error
