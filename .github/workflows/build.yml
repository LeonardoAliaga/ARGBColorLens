name: Build and Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify IntelliJ plugin
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile, test, package, and verify
        run: bash ./gradlew check buildPlugin verifyPlugin --stacktrace

      - name: Upload plugin distribution
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ARGBColorLens-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARGBColorLens-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
