name: Verify Plugin Signing

# Safe, pre-publication check. Does not contact JetBrains Marketplace.
# Runs once when introduced to main and can be rerun manually.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-signing.yml"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signature:
    name: Sign and verify ZIP without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets exist
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, sign and verify (no publication)
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: bash ./gradlew check buildPlugin signPlugin verifyPluginSignature --stacktrace
